name: PHP syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP version
        run: php --version
      - name: Check PHP syntax
        run: find mym -name '*.php' -print0 | xargs -0 -n1 php -l
