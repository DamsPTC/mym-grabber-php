name: PHP syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP version
        run: php --version
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check root entry point
        run: |
          php index.php > /tmp/mym-root.html
          grep -Fq '<title>MYM Grabber</title>' /tmp/mym-root.html
          grep -Fq 'name="u"' /tmp/mym-root.html
